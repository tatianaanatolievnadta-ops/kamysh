name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p _site
          cp -r index.html css js assets docs _site/
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            cat > _site/js/telegram-config.js <<EOF
          window.TELEGRAM_CONFIG = {
            botToken: "$BOT_TOKEN",
            chatId: "$CHAT_ID",
          };
          EOF
          else
            cp js/telegram-config.example.js _site/js/telegram-config.js
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
